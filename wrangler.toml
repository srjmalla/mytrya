# Cloudflare Pages configuration. Deploys run from .github/workflows/deploy.yml:
# a push to `main` or the daily schedule deploys production (branch hero-image-fix).
# This file is the source of truth for build output and compatibility date.
name = "mytrya-ai-website"
pages_build_output_dir = "./out"
compatibility_date = "2026-09-01"

# Secrets are NOT set here. Add them in the dashboard: the project's Settings,
# Variables and Secrets, Production, type Secret. (Secrets set with
# `wrangler pages secret put` did not bind to deployments on this account.)
# Optional plain vars:
# [vars]
# CONTACT_TO = "malla.srj@mytrya.com"
# CONTACT_FROM = "Mytrya site <contact@mytrya.com>"
